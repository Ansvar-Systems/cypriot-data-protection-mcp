# sources.yml -- Data provenance metadata
# Reference: docs/mcp-infrastructure-blueprint.md
# Last verified: 2026-05-17 (MT/CY fleet hygiene Round 2)

schema_version: "1.0"
mcp_name: "Cypriot Data Protection MCP"
category: "domain_intelligence"
jurisdiction: "CY"

sources:
  - name: "Office of the Commissioner for Personal Data Protection (CDPC)"
    authority: "Office of the Commissioner for Personal Data Protection, Republic of Cyprus"
    official_url: "https://www.dataprotection.gov.cy"
    retrieval_method: "HTML_SCRAPE"
    format: "HTML"
    authentication: "none"
    update_frequency: "monthly"
    license:
      code: "Cyprus-PSI"
      type: "Statutory — Cyprus public-sector information re-use regime"
      url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019L1024"
      evidence_url: "https://web.archive.org/web/2025/http://www.dataprotection.gov.cy/dataprotection/dataprotection.nsf/disclaimer_en/disclaimer_en?OpenDocument"
      summary: >
        The Office of the Commissioner for Personal Data Protection is a
        public-sector body of the Republic of Cyprus within scope of Law
        143(I)/2021 (transposing EU Directive 2019/1024 on Open Data and
        re-use of public sector information). Article 8 of the directive
        mandates commercial re-use. CDPC disclaimer page is silent on
        reuse and asserts Republic-of-Cyprus copyright; the assertion does
        not displace the statutory PSI re-use regime. Verbatim disclaimer
        text recovered via Wayback Machine 2026-05-17.
      attribution_block: "Source: Office of the Commissioner for Personal Data Protection, Republic of Cyprus. Reproduced under Cyprus public-sector information re-use regime (Law 143(I)/2021, transposing EU Directive 2019/1024)."
    source_url_pattern: "^https?://(www\\.)?dataprotection\\.gov\\.cy/dataprotection/dataprotection\\.nsf/.*"
    source_url_pattern_granularity: "item-level"
    coverage:
      scope: >
        CDPC decisions, sanctions, guidance documents, opinions on GDPR
        implementation in Cyprus, and the Processing of Personal Data
        (Protection of Individuals) Law 125(I)/2018.
    languages:
      - "el"
      - "en"
    known_operational_issues:
      - "Upstream TLS certificate returns not-trusted error to direct browsers (decoupled from licensing posture; tracked as recovery.blockers, not a licensing red)."
